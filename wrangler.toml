name = "agent-for-ray"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = [ "nodejs_compat" ]

# [limits]
# cpu_ms = 10

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[d1_databases]]
binding = "agent_for_ray_db"
database_name = "agent-for-ray-db"
database_id = "ab6f31da-0e06-4893-9f86-cd2c3fde7094"